<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>emotion_effecter</title>
<style>
:root {
  --bg: #f3f3f1; --panel: #ffffff; --panel2: #fafaf8; --line: #deded8; --text: #1d1d1b;
  --mute: #6c6c66; --accent: #c2410c; --accent-soft: #fde7da; --ok: #15803d; --warn: #b45309;
  --bad: #b91c1c; --wave: #9a9a92; --beat: #00000018; --mark: #1d4ed8; --doubt: #d97706;
  --head: #c2410c; --blockA: #e6ebf5; --blockB: #dde4f1; --lineA: #efe7f6; --lineB: #e6dcf1;
  --screen: #0b0b0a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121211; --panel: #1b1b19; --panel2: #171716; --line: #31312d; --text: #ecebe6;
    --mute: #9a9990; --accent: #fb923c; --accent-soft: #3a2416; --ok: #4ade80; --warn: #fbbf24;
    --bad: #f87171; --wave: #6b6b64; --beat: #ffffff14; --mark: #60a5fa; --doubt: #fbbf24;
    --head: #fb923c; --blockA: #1f2a3d; --blockB: #243149; --lineA: #2c2238; --lineB: #342842;
    --screen: #000;
  }
}
:root[data-theme="dark"] {
  --bg: #121211; --panel: #1b1b19; --panel2: #171716; --line: #31312d; --text: #ecebe6;
  --mute: #9a9990; --accent: #fb923c; --accent-soft: #3a2416; --ok: #4ade80; --warn: #fbbf24;
  --bad: #f87171; --wave: #6b6b64; --beat: #ffffff14; --mark: #60a5fa; --doubt: #fbbf24;
  --head: #fb923c; --blockA: #1f2a3d; --blockB: #243149; --lineA: #2c2238; --lineB: #342842;
  --screen: #000;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); overflow: hidden;
  font: 13px/1.45 system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  padding: 3px 10px; cursor: pointer; white-space: nowrap; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button:disabled { opacity: .5; cursor: default; }
input, select, textarea { background: var(--bg); border: 1px solid var(--line);
  border-radius: 6px; padding: 2px 6px; }
textarea { width: 100%; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
code, .mono { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
.hint { color: var(--mute); font-size: 12px; }
.problems { margin: 0; padding-left: 18px; color: var(--bad); }
.ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); }
.row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
kbd { border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font-size: 11px; }

/* ---- 全体の枠：上に帯、左上＝素材、右上＝プレビュー、下＝タイムライン ---- */
.app { height: 100vh; display: grid;
  grid-template-rows: 40px minmax(120px, 1fr) 5px var(--tl-h, 300px);
  grid-template-columns: var(--left-w, 400px) 5px minmax(0, 1fr); }
.bar { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: 0 12px;
  background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; }
.bar .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .grow { flex: 1; }
.pill { border-radius: 999px; padding: 1px 10px; font-size: 12px; background: var(--bg);
  border: 1px solid var(--line); cursor: pointer; white-space: nowrap; }
.pill.run { color: var(--accent); border-color: var(--accent); }
.pill.done { color: var(--ok); } .pill.failed { color: var(--bad); }
.panel { background: var(--panel); min-width: 0; min-height: 0; display: flex;
  flex-direction: column; overflow: hidden; }
.split-v { cursor: col-resize; background: var(--line); }
.panel.timeline { grid-column: 1 / -1; }
.split-h { grid-column: 1 / -1; cursor: row-resize; background: var(--line); }
.split-v:hover, .split-h:hover { background: var(--accent); }

/* 左上 */
.tabs { display: flex; border-bottom: 1px solid var(--line); flex: none; }
.tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0;
  background: none; padding: 7px 12px; }
.tabs button.on { border-bottom-color: var(--accent); color: var(--accent); font-weight: 600; }
.tabs .dirty { margin-left: auto; align-self: center; padding-right: 10px; }
.scroll { overflow: auto; flex: 1; min-height: 0; }
.group { padding: 8px 10px 2px; color: var(--mute); font-size: 11px; font-weight: 600;
  letter-spacing: .04em; display: flex; justify-content: space-between; }
.mat { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 6px;
  align-items: center; padding: 4px 10px; cursor: pointer; }
.mat:hover { background: var(--panel2); }
.mat.on { background: var(--accent-soft); }
.mat .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mat .ico { text-align: center; color: var(--mute); }
.badge { font-size: 11px; border-radius: 4px; padding: 0 5px; background: var(--blockA);
  color: var(--mark); margin-left: 3px; }
.mat select { font-size: 11px; padding: 0 2px; max-width: 92px; }
.sec { padding: 10px 12px; border-bottom: 1px solid var(--line); }
.sec h3 { margin: 0 0 8px; font-size: 13px; }
.grid { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 6px 10px;
  align-items: center; }
.grid label { color: var(--mute); }
.stick { position: sticky; top: 0; z-index: 1; background: var(--panel); }
pre.log { background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
  padding: 8px; max-height: 260px; overflow: auto; font-size: 11px; white-space: pre-wrap;
  margin: 6px 0 0; }
details summary { cursor: pointer; color: var(--mute); }

/* 右上：プレビュー */
.mon-head { display: flex; align-items: center; gap: 8px; padding: 5px 10px; flex: none;
  border-bottom: 1px solid var(--line); min-width: 0; }
.mon-head .what { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.screen { position: relative; flex: 1; min-height: 0; background: var(--screen);
  display: flex; align-items: center; justify-content: center; overflow: hidden; }
.screen > video, .screen > img, .layer > video, .layer > img {
  max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
#material { background: var(--screen); }
.layer { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.layer[hidden] { display: none; }
.layer pre { color: #e9e9e4; background: #000a; margin: 0; padding: 12px; max-width: 100%;
  max-height: 100%; overflow: auto; font-size: 12px; white-space: pre-wrap; }
.empty { color: #8a8a82; font-size: 13px; text-align: center; padding: 20px; }
.caption { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center;
  pointer-events: none; text-shadow: 0 1px 3px #000; color: #fff; }
.caption .now { font-size: 17px; font-weight: 600; }
.caption .next { font-size: 13px; opacity: .6; }
.caption .secname { position: absolute; left: 12px; top: -1000px; }
.tagline { position: absolute; left: 10px; top: 8px; font-size: 11px; color: #fff;
  background: #0008; border-radius: 4px; padding: 1px 6px; pointer-events: none; }

/* 下：タイムライン */
.tl-bar { display: flex; align-items: center; gap: 8px; padding: 5px 10px; flex: none;
  border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tl-bar .sep { width: 1px; height: 18px; background: var(--line); }
.tl-bar input[type=range] { width: 90px; }
.time { font-family: ui-monospace, Menlo, monospace; font-size: 12px; min-width: 120px; }
.tl-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 112px minmax(0, 1fr); }
.heads { border-right: 1px solid var(--line); background: var(--panel2); display: flex;
  flex-direction: column; }
.th { border-bottom: 1px solid var(--line); padding: 3px 8px; font-size: 12px;
  display: flex; flex-direction: column; justify-content: center; cursor: pointer; }
.th.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.th.off { opacity: .5; cursor: default; }
.th .hint { font-weight: 400; }
#tlscroll { overflow-x: auto; overflow-y: hidden; position: relative; min-width: 0; }
#tlspace { height: 1px; }
#tl { position: sticky; left: 0; top: 0; display: block; cursor: default; }
.msg { padding: 14px; color: var(--mute); }

@media (max-width: 900px) {
  body { overflow: auto; }
  .app { height: auto; grid-template-columns: 1fr; grid-template-rows: auto auto 0 auto 0 auto; }
  .split-v, .split-h { display: none; }
  .panel.left { max-height: 60vh; } .panel.monitor { height: 46vh; } .panel.timeline { height: 340px; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="bar">
    <select id="songsel" title="曲"></select>
    <span class="title" id="songtitle"></span>
    <span class="hint" id="songpath"></span>
    <span class="grow"></span>
    <span id="jobpill"></span>
  </header>
  <section class="panel left">
    <div class="tabs" id="lefttabs"></div>
    <div class="scroll" id="left"></div>
  </section>
  <div class="split-v" id="splitv" title="ドラッグで幅を変える"></div>
  <section class="panel monitor">
    <div class="mon-head" id="monhead"></div>
    <div class="screen" id="screen">
      <div class="layer" id="program"></div>
      <div class="layer" id="material" hidden></div>
      <div class="caption" id="caption"></div>
      <span class="tagline" id="tagline"></span>
    </div>
  </section>
  <div class="split-h" id="splith" title="ドラッグで高さを変える"></div>
  <section class="panel timeline">
    <div class="tl-bar" id="tlbar"></div>
    <div class="tl-body" id="tlbody"><div class="msg">左上で曲を選ぶ。</div></div>
  </section>
</div>
<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, "");
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null) el.append(k);
  return el;
};
async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  const body = await r.json().catch(() => null);
  if (!r.ok) throw new Error((body && body.detail) || r.statusText);
  return body;
}
const fmt = s => s == null ? "—" :
  `${Math.floor(s / 60)}:${(s % 60).toFixed(2).padStart(5, "0")}`;
const fmtShort = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const parseTime = t => {
  const m = String(t).trim().match(/^(?:(\d+):)?(\d+(?:\.\d+)?)$/);
  return m ? (+(m[1] || 0)) * 60 + (+m[2]) : null;
};
const ago = t => { const d = (Date.now() / 1000 - t);
  return d < 60 ? "今" : d < 3600 ? `${Math.floor(d / 60)}分前` :
    d < 86400 ? `${Math.floor(d / 3600)}時間前` : `${Math.floor(d / 86400)}日前`; };
const size = n => n < 1e6 ? `${Math.round(n / 1e3)} KB` : `${(n / 1e6).toFixed(1)} MB`;
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const enc = encodeURIComponent;
const songUrl = (p = "") => `/api/songs/${enc(S.name)}${p}`;
const css = k => getComputedStyle(document.documentElement).getPropertyValue(k).trim();

const S = { songs: [], choices: null, name: null, tab: store.get("tab") || "materials",
            song: null, doc: null, jobs: [], mats: [], matSel: null, dirty: false };

// ============================================================= 曲
async function loadSongs() {
  [S.songs, S.jobs] = await Promise.all([api("/api/songs"), api("/api/jobs")]);
  const sel = $("#songsel");
  sel.replaceChildren(h("option", { value: "", disabled: true, selected: !S.name }, "曲を選ぶ"),
    ...S.songs.map(s => h("option", { value: s.name, selected: s.name === S.name },
      `${s.title || s.name}${s.problems ? `（問題 ${s.problems}）` : ""}`)));
  jobPill();
}
$("#songsel").addEventListener("change", e => {
  if ((S.dirty || T.dirty) && !confirm("保存していない変更がある。曲を移る？")) {
    e.target.value = S.name; return; }
  openSong(e.target.value);
});
async function openSong(name) {
  S.name = name; store.set("song", name); S.matSel = null; S.dirty = false;
  const r = await api(songUrl());
  S.song = r; S.doc = structuredClone(r.doc);
  $("#songtitle").textContent = S.doc.title || S.name;
  $("#songpath").textContent = `music_data/${S.name}/`;
  await Promise.all([loadSongs(), loadMaterials()]);
  renderLeft(); setProgram(); loadTimeline();
}
function current() { return S.songs.find(s => s.name === S.name) || { outputs: {} }; }
function markDirty() {
  const el = $("#leftdirty"); if (el) el.textContent = S.dirty || T.dirty ? "● 未保存" : "";
}

// ============================================================= 左上：素材・設定・書き出し
const TABS = [["materials", "素材"], ["settings", "設定"], ["render", "書き出し"]];
function renderLeft() {
  $("#lefttabs").replaceChildren(...TABS.map(([k, label]) => h("button", {
    class: S.tab === k ? "on" : "", onclick: () => { S.tab = k; store.set("tab", k); renderLeft(); } },
    label)), h("span", { class: "dirty hint warn", id: "leftdirty" }));
  const pane = $("#left"); pane.replaceChildren(); pane.scrollTop = 0;
  if (!S.name) return;
  ({ materials: Materials, settings: Settings, render: Render })[S.tab](pane);
  markDirty();
}

// ------------------------------------------------------------- 素材
const ICON = { audio: "♪", image: "▣", video: "▶", lyrics: "≡", data: "{}" };
const ROLES = { audio: ["audio"], image: ["image"], lyrics: ["lyrics"],
                video: ["opening", "closing", "published", "audience"] };
async function loadMaterials() { S.mats = await api(songUrl("/materials")); }
function matUrl(m) {
  const t = Math.round(m.mtime);
  return m.where === "song" ? songUrl(`/files/${m.path.split("/").map(enc).join("/")}?t=${t}`)
    : songUrl(`/out/${enc(m.path)}?t=${t}`);
}
function roleOf(m) {   // 編集中の song.json の上での役割
  const f = S.doc.files || {};
  return m.where === "song" ? Object.keys(f).filter(r => f[r] === m.path).sort() : [];
}
function Materials(pane) {
  const group = (title, rows, note) => [
    h("div", { class: "group" }, h("span", {}, title), h("span", {}, note || "")),
    rows.length ? rows.map(matRow) : h("div", { class: "mat hint" }, "", "無い")];
  const song = S.mats.filter(m => m.where === "song"), out = S.mats.filter(m => m.where === "out");
  pane.append(
    ...group(`曲のファイル  music_data/${S.name}/`, song).flat(),
    ...group(`出力  out/${S.name}/`, out).flat(),
    h("p", { class: "hint", style: "padding:8px 10px" },
      "クリックでプレビューに出す。役割（右の選択）を変えると song.json の files が変わる",
      "（「設定」で保存）。"));
}
function matRow(m) {
  const roles = roleOf(m), can = m.where === "song" ? ROLES[m.kind] || [] : [];
  const pickRole = can.length ? h("select", { title: "song.json の files の役割",
    onclick: e => e.stopPropagation(), onchange: e => {
      const f = S.doc.files || (S.doc.files = {});
      for (const r of roles) delete f[r];
      if (e.target.value) f[e.target.value] = m.path;
      changed(); renderLeft(); setProgram(); } },
    h("option", { value: "" }, "—"),
    can.map(r => h("option", { value: r, selected: roles.includes(r) }, r))) : null;
  const key = `${m.where}:${m.path}`;
  return h("div", { class: "mat" + (S.matSel === key ? " on" : ""),
    title: `${m.path}  ${size(m.size)}  ${ago(m.mtime)}`,
    onclick: () => { S.matSel = key; showMaterial(m); renderLeft(); } },
    h("span", { class: "ico" }, ICON[m.kind] || "·"),
    h("span", { class: "name" }, m.path, pickRole ? null : roles.map(r => h("span", { class: "badge" }, r))),
    pickRole || h("span", { class: "hint" }, ago(m.mtime)));
}

// ------------------------------------------------------------- 設定（song.json）
const ADVANCED = ["policy", "sections", "tempo", "moods", "overlays", "keys", "credits",
                  "reel", "audience"];
let checkTimer = null;
function setPath(obj, path, value) {
  let o = obj;
  for (const k of path.slice(0, -1)) { if (typeof o[k] !== "object" || !o[k]) o[k] = {}; o = o[k]; }
  const last = path[path.length - 1];
  if (value === undefined) delete o[last]; else o[last] = value;
}
const getPath = path => path.reduce((o, k) => o == null ? undefined : o[k], S.doc);
function changed() {
  S.dirty = true; markDirty();
  clearTimeout(checkTimer);
  checkTimer = setTimeout(async () => {
    S.problems = await api(songUrl("/check"), { method: "POST", body: JSON.stringify(S.doc) });
    showProblems();
  }, 300);
}
function showProblems() {
  const el = $("#problems"); if (!el) return;
  const p = S.problems || S.song.problems;
  el.replaceChildren(p.length ? h("ul", { class: "problems" }, p.map(x => h("li", {}, x)))
    : h("span", { class: "ok" }, "問題なし"));
}
function field(label, input, hint) {
  return [h("label", {}, label), h("div", { class: "row" }, input, hint ? h("span", { class: "hint" }, hint) : null)];
}
function text(path, opts = {}) {
  return h("input", { value: getPath(path) ?? "", placeholder: opts.placeholder || "", size: opts.size || 24,
    oninput: e => { setPath(S.doc, path, e.target.value === "" && opts.drop ? undefined : e.target.value); changed(); } });
}
function num(path, opts = {}) {
  return h("input", { type: "number", step: opts.step || "any", min: opts.min, max: opts.max,
    value: getPath(path) ?? "", style: "width:90px", placeholder: opts.placeholder ?? "",
    oninput: e => { setPath(S.doc, path, e.target.value === "" ? undefined : +e.target.value); changed(); } });
}
function pick(path, options, opts = {}) {
  const v = getPath(path);
  const sel = h("select", { onchange: e => {
    setPath(S.doc, path, e.target.value === "" ? undefined : e.target.value); changed();
    if (opts.after) opts.after(); } },
    opts.none ? h("option", { value: "" }, opts.none) : null,
    options.map(o => h("option", { value: o, selected: o === v }, o)));
  if (v != null && !options.includes(v)) sel.append(h("option", { value: v, selected: true }, `${v}（無い）`));
  return sel;
}
function sec(title, ...body) { return h("div", { class: "sec" }, h("h3", {}, title), ...body); }
function toggle(label, key, make, body) {
  const on = S.doc[key] != null;
  const box = h("input", { type: "checkbox", checked: on, onchange: e => {
    if (e.target.checked) S.doc[key] = make(); else delete S.doc[key];
    changed(); renderLeft(); } });
  return h("div", { class: "sec" }, h("h3", {}, h("label", { class: "row" }, box, label)),
    on ? body() : null);
}
function Settings(pane) {
  pane.append(h("div", { class: "sec stick" },
    h("div", { class: "row" }, h("button", { class: "primary", onclick: saveDoc }, "保存"),
      h("button", { onclick: () => openSong(S.name) }, "元に戻す"),
      h("details", {}, h("summary", {}, "song.json 全体"),
        h("pre", { class: "log" }, JSON.stringify(S.doc, null, 2)))),
    h("div", { id: "problems", style: "margin-top:6px" })),
    ...SettingsBody());
  showProblems();
}
function SettingsBody() {
  const f = S.song.files, c = S.choices, d = S.doc;
  const isPreset = d.base && "preset" in d.base;
  const fileRow = (role, kind, opt) => field(role, pick(["files", role], f[kind],
    { none: opt ? "なし" : "選ぶ", after: setProgram }));
  return [
    sec("曲", h("div", { class: "grid" },
      field("題", text(["title"])), field("ジャンル", text(["genre"]), "effect の提案に使う"))),
    sec("ファイル", h("div", { class: "grid" },
      fileRow("lyrics", "lyrics"), fileRow("audio", "audio"), fileRow("image", "image"),
      fileRow("opening", "video", true), fileRow("closing", "video", true),
      fileRow("published", "video", true), fileRow("audience", "video", true))),
    sec("土台の effect", h("div", { class: "grid" },
      field("書き方", h("select", { onchange: e => {
        S.doc.base = e.target.value === "preset" ? { preset: c.presets[0] }
          : { effect: c.effects[0], params: {} }; changed(); renderLeft(); } },
        h("option", { value: "preset", selected: isPreset }, "preset"),
        h("option", { value: "effect", selected: !isPreset }, "effect と引数"))),
      isPreset ? field("preset", pick(["base", "preset"], c.presets))
        : [field("effect", pick(["base", "effect"], c.effects)),
           field("引数", jsonBox(["base", "params"], 4))])),
    sec("つなぎ目（Opening / Closing）", h("div", { class: "grid" },
      field("重ねる秒数", num(["clip_xfade"], { min: 0, step: 0.1, placeholder: "0" }), "0 か空で切り替え"),
      field("切り替え方", pick(["clip_transition"], c.transitions, { none: "fade（既定）" })))),
    CreditsBody(),
    toggle("黒から入る（fade_in）", "fade_in", () => ({ after: S.song.sections[0] || "Intro", seconds: 2 }),
      () => h("div", { class: "grid" },

  for (const [k] of TRACKS) { g.fillStyle = css("--line"); g.fillRect(0, T.rows[k][0] + T.rows[k][1] - 1, W, 1); }
  const x = Math.round(t2x(now()));
  g.fillStyle = css("--head"); g.fillRect(x - 1, 0, 2, Hh);
  g.beginPath(); g.moveTo(x - 5, 0); g.lineTo(x + 5, 0); g.lineTo(x, 7); g.fill();
}
function drawRuler(g, W) {
  const [y, hh] = T.rows.ruler, steps = [0.5, 1, 2, 5, 10, 15, 30, 60];
  const step = steps.find(s => s * T.pps >= 56) || 60;
  g.fillStyle = css("--panel2"); g.fillRect(0, y, W, hh);
  g.fillStyle = css("--mute");
  const t0 = Math.floor(x2t(0) / step) * step;
  for (let t = t0; t2x(t) < W; t += step) {
    const x = Math.round(t2x(t)); if (x < -40) continue;
    g.fillRect(x, y + hh - 6, 1, 6); g.fillText(fmtShort(t), x + 3, y + hh / 2 - 1);
  }
}
function block(g, x0, x1, y, hh, fill, on, doubt, text) {
  const L = Math.max(x0, -2), R = Math.min(x1, g.canvas.width);
  if (R <= L) return;
  g.fillStyle = on ? css("--accent-soft") : fill; g.fillRect(L, y + 2, R - L - 1, hh - 4);
  g.fillStyle = doubt ? css("--doubt") : on ? css("--accent") : css("--mark");
  g.fillRect(x0, y + 1, on ? 3 : 2, hh - 2);
  g.save(); g.beginPath(); g.rect(Math.max(x0 + 4, 0), y, x1 - x0 - 6, hh); g.clip();
  g.fillStyle = on ? css("--accent") : css("--text");
  g.fillText(text, Math.max(x0 + 6, 4), y + hh / 2); g.restore();
}
function drawSections(g, W) {
  const [y, hh] = T.rows.sections, on = T.track === "sections";
  T.sec.forEach((s, i) => {
    if (s == null) return;
    const [a, b] = sectionSpan(i), x0 = t2x(a), x1 = t2x(b);
    if (x1 < 0 || x0 > W) return;
    block(g, x0, x1, y, hh, i % 2 ? css("--blockB") : css("--blockA"), on && i === T.sel.sections,
      T.doubt[i], T.data.sections[i].name + (T.doubt[i] ? " ？" : ""));
  });
}
function drawLines(g, W) {
  const [y, hh] = T.rows.lines, on = T.track === "lines";
  if (!T.data.line_spread) { g.fillStyle = css("--mute"); g.fillText("セクションの時刻を保存すると置ける", 8, y + hh / 2); return; }
  g.globalAlpha = 0.35; g.fillStyle = css("--mark");
  T.sec.forEach(s => { if (s != null) g.fillRect(Math.round(t2x(s)), y, 1, hh); });
  g.globalAlpha = 1;
  const half = hh / 2;
  T.ln.forEach((s, k) => {
    if (s == null) return;
    const [a, b] = lineSpan(k), x0 = t2x(a), x1 = t2x(b);
    if (x1 < 0 || x0 > W) return;
    block(g, x0, x1, y + (k % 2) * half, half, k % 2 ? css("--lineB") : css("--lineA"),
      on && k === T.sel.lines, false, lineText(k));
  });
}
function drawWave(g, W) {
  const [y, hh] = T.rows.wave, mid = y + hh / 2, pk = T.data.peaks, dur = T.data.duration;
  g.fillStyle = css("--beat");
  for (const b of T.data.beats) { const x = Math.round(t2x(b)); if (x >= 0 && x <= W) g.fillRect(x, y, 1, hh); }
  g.fillStyle = css("--wave");
  for (let x = 0; x < W; x++) {
    const t = x2t(x); if (t < 0 || t > dur) continue;
    const v = pk[Math.floor(t / dur * (pk.length - 1))] || 0, a = v * (hh - 8) / 2;
    g.fillRect(x, mid - a, 1, a * 2 || 1);
  }
}
function trackAt(y) { return TRACKS.map(([k]) => k).find(k => y >= T.rows[k][0] && y < T.rows[k][0] + T.rows[k][1]); }
function hitMarker(track, x) {
  return arr(track).findIndex(t => t != null && Math.abs(t2x(t) - x) < 6);
}
function hover(e) {
  const tr = trackAt(e.offsetY), cv = $("#tl");
  cv.style.cursor = (tr === "sections" || (tr === "lines" && T.data.line_spread)) && hitMarker(tr, e.offsetX) >= 0
    ? "ew-resize" : tr === "ruler" || tr === "wave" ? "text" : "pointer";
}
function down(e) {
  const tr = trackAt(e.offsetY), t = x2t(e.offsetX);
  if (tr === "ruler" || tr === "wave") { seek(t); scrub(); return; }
  if (tr === "lines" && !T.data.line_spread) return;
  if (tr !== T.track) selectTrack(tr);
  const hit = hitMarker(tr, e.offsetX);
  if (hit >= 0) { T.sel[tr] = hit; tlBar(); drag(tr, hit); return; }
  const a = arr(tr);   // 帯をクリック：その印を選んでそこへ
  let i = -1; a.forEach((s, k) => { if (s != null && s <= t) i = k; });
  if (i >= 0) { T.sel[tr] = i; tlBar(); seek(a[i]); }
}
function scrub() {
  const r = $("#tl").getBoundingClientRect();
  const move = ev => seek(x2t(ev.clientX - r.left));
  const up = () => { removeEventListener("mousemove", move); removeEventListener("mouseup", up); };
  addEventListener("mousemove", move); addEventListener("mouseup", up);
}
function drag(tr, i) {
  const r = $("#tl").getBoundingClientRect(), a = arr(tr);
  const move = ev => {
    const [lo, hi] = bounds(i, tr);
    a[i] = Math.min(hi, Math.max(lo, snap(x2t(ev.clientX - r.left), ev.shiftKey, tr)));
    delete T.doubt[i]; T.dirty = true; markDirty(); draw();
  };
  const up = () => { removeEventListener("mousemove", move); removeEventListener("mouseup", up);
    a[i] = Math.round(a[i] * 1000) / 1000; tlBar(); };
  addEventListener("mousemove", move); addEventListener("mouseup", up);
}
function snap(t, free, track = T.track) {
  if (!T.snap || free || track === "lines" || !T.data.beats.length) return t;
  const b = T.data.beats; let lo = 0, hi = b.length - 1;
  while (lo < hi) { const m = (lo + hi) >> 1; if (b[m] < t) lo = m + 1; else hi = m; }
  const c = [b[lo], b[lo - 1]].filter(v => v != null);
  return c.reduce((a, v) => Math.abs(v - t) < Math.abs(a - t) ? v : a, c[0]);
}
function bounds(i, track = T.track) {
  const a = arr(track);
  const prev = a.slice(0, i).filter(v => v != null).pop();
  const next = a.slice(i + 1).find(v => v != null);
  const gap = track === "lines" ? 0.01 : 0.05;
  return [prev == null ? 0 : prev + gap, next == null ? T.data.duration : next - gap];
}
function setStart(i, t, free) {
  const [lo, hi] = bounds(i), a = arr();
  a[i] = Math.round(Math.min(hi, Math.max(lo, snap(t, free))) * 1000) / 1000;
  delete T.doubt[i]; T.dirty = true; markDirty(); tlBar(); heads(); draw(); caption();
}
function seek(t) { if (!P.media) return; P.media.currentTime = Math.max(0, Math.min(t, T.data ? T.data.duration : t)); draw(); caption(); }
function playPause() {
  if (!P.media) return;
  if (!$("#material").hidden) hideMaterial();
  if (P.media.paused) P.media.play(); else P.media.pause();
}
function playButton() { const b = $("#play"); if (b) b.textContent = P.media && !P.media.paused ? "❚❚" : "▶"; }
function tick() {
  cancelAnimationFrame(T.raf);
  const step = () => {
    if (P.media && !P.media.paused && $("#tlscroll")) {
      const sc = $("#tlscroll"), x = t2x(now());
      if (x < 0 || x > sc.clientWidth - 60) sc.scrollLeft += x - 60;
      draw(); caption();
    }
    const el = $("#now"); if (el && T.data) el.textContent = `${fmt(now())} / ${fmt(T.data.duration)}`;
    T.raf = requestAnimationFrame(step);
  };
  T.raf = requestAnimationFrame(step);
}
function note(text) {
  const el = $("#tlmsg"); if (!el || !T.data) return;
  if (text != null) { el.textContent = text; return; }
  if (!T.data.sections.length) el.textContent = "歌詞に [ ] のセクションが無い";
  else if (T.track === "sections" && T.sec.some(s => s == null))
    el.textContent = "時刻の無いセクションがある。「自動で置く」か、再生しながら M で置く。";
  else if (T.track === "lines")
    el.textContent = T.data.line_note || (T.data.line_starts ? "" : "仮置き。再生しながら M で置いていく。");
  else el.textContent = "";
}
addEventListener("keydown", e => {
  if (!T.data || ["INPUT", "TEXTAREA", "SELECT"].includes(e.target.tagName)) return;
  const a = arr(), i = T.sel[T.track];
  if (e.code === "Space") { e.preventDefault(); if (e.target.blur) e.target.blur(); playPause(); }
  else if (e.key === "ArrowUp" || e.key === "ArrowDown") {
    e.preventDefault();
    T.sel[T.track] = Math.max(0, Math.min(a.length - 1, i + (e.key === "ArrowUp" ? -1 : 1)));
    tlBar(); draw();
  } else if ((e.key === "ArrowLeft" || e.key === "ArrowRight") && a[i] != null) {
    e.preventDefault();
    setStart(i, a[i] + (e.key === "ArrowLeft" ? -1 : 1) * (e.shiftKey ? 0.01 : 0.05), true);
  } else if ((e.key === "r" || e.key === "R") && a[i] != null) {
    seek(a[i] - 3); if (P.media.paused) playPause();
  } else if (e.key === "t" || e.key === "T") {
    if (T.track === "sections" && T.data.line_spread) selectTrack("lines"); else selectTrack("sections");
  } else if (e.key === "m" || e.key === "M") {
    const t = now();
    for (let k = i + 1; k < a.length; k++)        // 後ろの印を追い越すなら後ろを空ける
      if (a[k] != null && a[k] <= t) a[k] = null; else break;
    setStart(i, t, true);
    T.sel[T.track] = Math.min(i + 1, a.length - 1); tlBar(); draw();
  }
});
async function autoPlace() {
  const b = $("#auto"); b.disabled = true; b.textContent = "推定中…";
  try {
    const r = await api(songUrl("/timeline/suggest"), { method: "POST" });
    T.sec = r.map(x => x.start); T.doubt = {}; T.dirty = true;
    r.forEach((x, i) => { if (x.doubtful) T.doubt[i] = true; });
    tlBar(); heads(); draw(); markDirty();
    const n = Object.keys(T.doubt).length;
    note(n ? `${n} か所は自信が無い（？ の付いた帯）。聴いて確かめる。` : "置いた。聴いて確かめる。");
  } catch (e) { note(e.message); b.disabled = false; b.textContent = "自動で置く"; }
}
function spreadLines() {
  T.ln = T.data.line_spread.flat(); T.dirty = true; markDirty(); heads(); draw();
  note("文字数で振り分けた。M で置き直していく。");
}
function nested() {
  const out = T.data.sections.map(() => []);
  T.lnKey.forEach(([i], k) => out[i].push(T.ln[k]));
  return out;
}
async function saveTimeline() {
  const lines = T.track === "lines", a = arr();
  if (a.some(s => s == null)) { note(lines ? "時刻の無い行がある" : "時刻の無いセクションがある"); return; }
  try {
    const r = await api(songUrl(`/timeline${lines ? "/lines" : ""}`),
      { method: "PUT", body: JSON.stringify({ starts: lines ? nested() : T.sec }) });
    T.dirty = false; markDirty(); loadMaterials().then(() => { if (S.tab === "materials") renderLeft(); });
    if (lines) { T.data.line_starts = nested(); T.data.line_note = ""; heads(); note(`保存した: ${r.file}`); loadSongs(); }
    else { await loadTimeline(); note(`保存した: ${r.file}`); }
  } catch (e) { note(e.message); }
}

// ============================================================= 仕切りの位置
function splitter(el, prop, axis, min, max) {
  const app = $("#app"), saved = store.get(prop);
  if (saved) app.style.setProperty(prop, saved);
  el.addEventListener("mousedown", e => {
    e.preventDefault();
    const move = ev => {
      const v = axis === "x" ? ev.clientX : innerHeight - ev.clientY;
      const px = Math.max(min, Math.min(max(), v)) + "px";
      app.style.setProperty(prop, px); store.set(prop, px);
    };
    const up = () => { removeEventListener("mousemove", move); removeEventListener("mouseup", up); };
    addEventListener("mousemove", move); addEventListener("mouseup", up);
  });
}
splitter($("#splitv"), "--left-w", "x", 260, () => innerWidth - 320);
splitter($("#splith"), "--tl-h", "y", 160, () => innerHeight - 200);
new ResizeObserver(() => { if (T.data) layout(); }).observe($(".panel.timeline"));
addEventListener("beforeunload", e => { if (S.dirty || T.dirty) e.preventDefault(); });

// ============================================================= 始め
(async () => {
  S.choices = await api("/api/choices");
  renderLeft(); tlBar();
  await loadSongs();
  const last = new URLSearchParams(location.search).get("song") || store.get("song");
  if (last && S.songs.some(s => s.name === last)) openSong(last);
})();
</script>
